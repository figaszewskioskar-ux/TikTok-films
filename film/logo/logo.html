<!doctype html><html><head><meta charset="utf-8"><style>

  <text font-family="Inter Display" font-weight="900" font-size="96" fill="#e0283f" letter-spacing="14" dominant-baseline="hanging"><textPath href="#arcB" startOffset="50%" text-anchor="middle">OCALENI</textPath></text>
