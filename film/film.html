<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="cv" width="1080" height="1920"></canvas>
<script>
// ładuje po kolei: oś czasu odcinka, silnik, sceny odcinka, render  (film.html?ep=odc2)
const ep = new URLSearchParams(location.search).get('ep') || 'odc1';
const list = [ep + '/timeline.js', 'lib.js', ep + '/scenes.js', 'engine.js'];
(function next(i) {
  if (i >= list.length) return;
  const s = document.createElement('script'); s.src = list[i];
  s.onload = s.onerror = () => next(i + 1);
  document.body.appendChild(s);
})(0);
</script></body></html>
