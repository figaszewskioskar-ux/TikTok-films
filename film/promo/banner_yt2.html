<!doctype html><html><head><meta charset="utf-8"><style>@font-face{font-family:Anton;src:url(anton-latin-ext-400-normal.woff2);unicode-range:U+0100-02AF}@font-face{font-family:Anton;src:url(anton-latin-400-normal.woff2)}
*{margin:0;box-sizing:border-box}
body{width:2560px;height:1440px;overflow:hidden;background:#06080f;font-family:Inter,"Inter Display",sans-serif}
.bg{position:absolute;inset:0;background:url(out/blok94-hero-bg.jpg) center 30%/cover;filter:blur(18px) brightness(.55);transform:scale(1.1)}
.bld{position:absolute;right:300px;top:0;height:1440px;width:1152px;background:url(out/blok94-hero-bg.jpg) center top/cover;-webkit-mask:linear-gradient(90deg,transparent,#000 22%,#000 78%,transparent);opacity:.95}
.shade{position:absolute;inset:0;background:radial-gradient(ellipse 1100px 520px at 1280px 720px,rgba(6,8,15,.15),rgba(6,8,15,.75) 70%),linear-gradient(90deg,rgba(6,8,15,.9) 0,rgba(6,8,15,.5) 40%,rgba(6,8,15,.05) 70%,rgba(6,8,15,.45))}
.lamp{position:absolute;left:780px;top:380px;width:900px;height:700px;background:radial-gradient(ellipse at 40% 50%,rgba(255,190,100,.16),transparent 60%)}
/* strefa bezpieczna 1546x423 od (507,508) */
.safe{position:absolute;left:507px;top:508px;width:1546px;height:423px}
.eyebrow{position:absolute;left:330px;top:4px;color:#f2b134;font:800 30px/1 Inter;letter-spacing:.3em}
h1{position:absolute;left:322px;top:58px;color:#f3efe6;font:900 210px/0.9 "Inter Display",Inter;letter-spacing:-.02em;text-shadow:0 10px 40px rgba(0,0,0,.6)}
h1 i{font-style:normal;position:relative}h1 i:after{content:"";position:absolute;left:6px;right:24px;bottom:-6px;height:16px;background:#d7263d}
.sub{position:absolute;left:330px;top:296px;color:#c9c7cf;font:700 28px/1.25 Inter;white-space:nowrap}
.sub b{color:#fff}
.tags{position:absolute;left:330px;top:362px;display:flex;gap:14px}
.tag{font:900 26px/1 Inter;letter-spacing:.08em;padding:12px 18px;border-radius:12px;color:#fff;background:#d7263d}
.tag.y{background:#f2b134;color:#14161b}.tag.d{background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.25)}
.ch{position:absolute;bottom:-20px}
.ch img{display:block;filter:drop-shadow(0 20px 30px rgba(0,0,0,.6))}
.kap{position:absolute;left:1180px;top:-40px}
.kap img{height:500px;filter:brightness(.85) drop-shadow(0 0 40px rgba(0,0,0,.9))}
.eyes{position:absolute;left:1180px;top:-40px;width:350px;height:500px;background:radial-gradient(circle at 51% 21%,rgba(255,240,200,.0),transparent)}
.cast{position:absolute;left:-90px;top:20px;width:380px;height:420px}
.cast img{position:absolute;bottom:0;height:420px}
.led{position:absolute;right:0;top:20px;padding:14px 22px;border:5px solid #ff3b30;box-shadow:0 0 28px rgba(255,40,30,.7);background:rgba(6,7,10,.9);color:#ff3b30;font:900 28px/1.1 Inter;letter-spacing:.06em;text-align:center;text-shadow:0 0 14px rgba(255,40,30,.9)}
.led b{display:block;font-size:44px}
.handle{position:absolute;right:30px;bottom:24px;color:#f3efe6;font:800 30px/1 Inter;opacity:.85}
.grain{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.035) 1px,transparent 1px);background-size:4px 4px}
.po{font:400 158px/0.95 Anton!important;letter-spacing:.03em!important;top:66px!important}.po span{display:block;font-size:66px;color:#ff2a44;letter-spacing:.5em;margin-top:2px;text-shadow:0 0 18px rgba(255,40,60,.7),0 0 40px rgba(255,40,60,.4)}.sub{top:316px!important}.tags{top:372px!important}</style></head><body>
<div class="bg"></div><div class="bld"></div><div class="shade"></div><div class="lamp"></div><div class="grain"></div>

</div>
<div style="position:absolute;left:1830px;top:540px"><img src="out/blok94-kaptur.png" style="height:540px;filter:brightness(.8) drop-shadow(0 0 50px rgba(0,0,0,.95))"></div>
</body></html>
