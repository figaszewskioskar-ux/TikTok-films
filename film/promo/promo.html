<!doctype html><html><head><meta charset="utf-8"></head><body style="margin:0;background:#000">
<canvas id="cv" width="1080" height="1920"></canvas>
<script src="../lib.js"></script>
<script>
// Grafiki promocyjne (postacie na przezroczystym tle, nocny blok)
const ctx = document.getElementById('cv').getContext('2d');
window.PROMO = {
  async ready() { await document.fonts.load('800 40px Inter'); await document.fonts.load('900 40px Inter'); },
  char(kind, o) {
    const c = document.createElement('canvas'); c.width = 700; c.height = 1000; const x = c.getContext('2d');
    person(x, kind, 350, 960, 3.0, Object.assign({ t: 1.3 }, o));
    return c.toDataURL('image/png').split(',')[1];
  },
  wall(kind) {
    const c = document.createElement('canvas'); c.width = 1080; c.height = 1920; const x = c.getContext('2d');
    if (kind === 1) { blockBg(x, 2, { night: true }); person(x, 'kaptur', 760, 1760, 2.4, { t: 1, back: true }); snow(x, 3, 120, .6); }
    if (kind === 2) { peepPOV(x, 1, (cc, cx, cy, r) => { cc.fillStyle = '#A9A595'; cc.fillRect(cx - r, cy - r, 2 * r, 2 * r); cc.save(); cc.translate(cx, cy + 1080); person(cc, 'kaptur', 0, 0, 4.6, { t: 1, glow: 1 }); cc.restore(); }); }
    if (kind === 3) { quilted(x, 0, 0, 1080, 1920, '#5E4029', '#4D3420', '#B8914E', 110); circ(x, 540, 900, 120, '#2A2420'); circ(x, 540, 900, 96, '#9C7B3E'); circ(x, 540, 900, 70, '#000'); fillRR(x, 440, 640, 200, 80, 40, '#C9A15A'); txt(x, '94', 540, 680, 52, '#3A2A1A', 900);
      x.save(); x.translate(540, 1380); x.rotate(-.02); fillRR(x, -440, -120, 880, 240, 24, '#D7263D'); txt(x, 'NIE PYTAJ', 0, -44, 96, '#FFFFFF', 900); txt(x, '„KTO TAM?”', 0, 54, 96, '#FFFFFF', 900); x.restore(); }
    const g = x.createRadialGradient(540, 960, 500, 540, 960, 1250); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.55)'); x.fillStyle = g; x.fillRect(0, 0, 1080, 1920);
    return c.toDataURL('image/jpeg', .9).split(',')[1];
  },
  heroBg() {
    const c = document.createElement('canvas'); c.width = 1080; c.height = 1350; const x = c.getContext('2d');
    x.translate(0, -420); blockBg(x, 2, { night: true });
    const wx = 110 + 5 * 107.5 + 53.75, wy = 400 + 40 + 89 + 27;
    x.fillStyle = 'rgba(120,160,230,.35)'; x.beginPath(); x.arc(wx, wy, 40, 0, 7); x.fill();
    snow(x, 3, 90, .6);
    x.setTransform(1, 0, 0, 1, 0, 0);
    const g = x.createLinearGradient(0, 900, 0, 1350); g.addColorStop(0, 'rgba(7,9,16,0)'); g.addColorStop(1, 'rgba(7,9,16,1)'); x.fillStyle = g; x.fillRect(0, 0, 1080, 1350);
    return c.toDataURL('image/jpeg', .9).split(',')[1];
  },
  // klatki Kaptura do animacji na stronie: 0 tyłem, 1 przodem (świecące oczy), 2..9 chód tyłem
  kapturSheet() {
    const FW = 480, FH = 720, c = document.createElement('canvas'); c.width = FW * 10; c.height = FH; const x = c.getContext('2d');
    const fr = [{ t: 1, back: true }, { t: 1, glow: 1 }];
    for (let k = 0; k < 8; k++) fr.push({ t: 1, back: true, walk: k * Math.PI / 4 });
    fr.forEach((o, i) => { x.save(); x.beginPath(); x.rect(i * FW, 0, FW, FH); x.clip(); person(x, 'kaptur', i * FW + FW / 2, 700, 2.4, o); x.restore(); });
    return c.toDataURL('image/png').split(',')[1];
  },
  hero() {
    const c = document.createElement('canvas'); c.width = 1080; c.height = 1350; const x = c.getContext('2d');
    x.translate(0, -420); blockBg(x, 2, { night: true });
    const wx = 110 + 5 * 107.5 + 53.75, wy = 400 + 40 + 89 + 27;
    x.fillStyle = 'rgba(120,160,230,.35)'; x.beginPath(); x.arc(wx, wy, 40, 0, 7); x.fill();
    person(x, 'kaptur', 760, 1760, 2.4, { t: 1, back: true });
    snow(x, 3, 90, .6);
    x.setTransform(1, 0, 0, 1, 0, 0);
    const g = x.createLinearGradient(0, 900, 0, 1350); g.addColorStop(0, 'rgba(7,9,16,0)'); g.addColorStop(1, 'rgba(7,9,16,1)'); x.fillStyle = g; x.fillRect(0, 0, 1080, 1350);
    return c.toDataURL('image/jpeg', .9).split(',')[1];
  },
};
</script></body></html>
