<!doctype html><html><head><meta charset="utf-8"></head><body style="margin:0;background:#000">
<canvas id="cv" width="1080" height="1920"></canvas>
<script src="../lib.js"></script>
<script>
// Grafiki promocyjne (postacie na przezroczystym tle, nocny blok)
const ctx = document.getElementById('cv').getContext('2d');
// Kaptur w pseudo-3D: th = obrót ciała (0 tyłem, PI przodem), hth = obrót głowy
function kap3d(c, x, y, s, th, hth, glow) {
  const K = KINDS.kaptur, cs = Math.cos(th), sn = Math.sin(th);
  c.save(); c.translate(x, y); ell(c, 0, 0, 62 * s, 11 * s, 'rgba(0,0,0,.28)'); c.scale(s, s);
  const items = [];
  // nogi
  for (const side of [-1, 1]) {
    const lx = side * 15 * cs, z = side * 15 * sn, toe = sn * 12;
    items.push({ z: z - 1, f: () => {
      const dk = z < 0 ? -.25 : 0;
      fillRR(c, lx - 10, -86, 20, 82, 8, shade(K.pants, dk));
      const sw = 30 * Math.abs(cs) + 42 * Math.abs(sn);
      fillRR(c, lx - sw / 2 + toe, -12, sw, 13, 6, K.shoes);
    } });
  }
  // ręce
  for (const side of [-1, 1]) {
    const ax = side * 40 * cs, z = side * 40 * sn, swing = 0.14 * Math.abs(cs) + 0.03;
    items.push({ z, f: () => {
      c.save(); c.translate(ax, -178); c.rotate(-side * Math.sign(cs || 1) * swing);
      const dk = z < -5 ? -.3 : (z > 5 ? .06 : 0);
      fillRR(c, -12, -8, 24, 100, 12, shade(K.jacket, dk));
      fillRR(c, -12, 78, 24, 10, 4, shade(K.jacket, dk - .25));
      circ(c, 0, 94, 13, shade(K.skin, dk)); c.restore();
    } });
  }
  // tułów
  items.push({ z: 0, f: () => {
    const w = 90 * Math.abs(cs) + 58 * Math.abs(sn);
    rr(c, -w / 2, -192, w, 122, 24); c.save(); c.clip();
    const g = c.createLinearGradient(-w / 2, 0, w / 2, 0);
    g.addColorStop(0, shade(K.jacket, .1)); g.addColorStop(.5 + sn * cs * .3, K.jacket); g.addColorStop(1, shade(K.jacket, -.35));
    c.fillStyle = g; c.fillRect(-w / 2, -192, w, 122);
    c.fillStyle = shade(K.jacket, -.22); c.fillRect(-w / 2, -82, w, 12);
    const fz = -cs; // przód widoczny
    if (fz > 0) { const pw = 52 * fz, px = sn * 22; c.globalAlpha = Math.min(1, fz * 2); fillRR(c, px - pw / 2, -128, pw, 30, 10, K.dark); c.globalAlpha = 1; }
    c.restore();
  } });
  items.sort((a, b) => a.z - b.z).forEach(i => i.f());
  // głowa / kaptur
  const hc = Math.cos(hth), hs = Math.sin(hth), hy = -236;
  c.save();
  const hg = c.createRadialGradient(-22, hy - 26, 8, 0, hy, 70); hg.addColorStop(0, '#2A2D34'); hg.addColorStop(1, '#141519');
  c.fillStyle = hg; c.beginPath(); c.arc(0, hy, 62, 0, 7); c.fill();
  c.fillStyle = hg; c.beginPath(); c.arc(hs * 10, hy + 2, 60, 0, 7); c.fill();
  c.beginPath(); c.arc(0, hy, 62, 0, 7); c.clip();
  if (hc > 0) { c.globalAlpha = hc; c.strokeStyle = '#0F1013'; c.lineWidth = 4; const bx = -hs * 58; c.beginPath(); c.moveTo(bx, hy - 62); c.quadraticCurveTo(bx * 1.25, hy, bx, hy + 62); c.stroke(); c.globalAlpha = 1; }
  const fz = -hc;
  if (fz > 0) {
    const fx = hs * 34 * (1 - fz * .55), fw = 41 * fz + 4, a = Math.min(1, fz * 1.8);
    c.globalAlpha = a;
    c.strokeStyle = '#2B2E35'; c.lineWidth = 6; c.beginPath(); c.ellipse(fx, hy + 10, fw + 4, 49, 0, 0, 7); c.stroke();
    ell(c, fx, hy + 10, fw, 45, '#0B0C0F');
    const g2 = c.createLinearGradient(0, hy - 35, 0, hy + 55); g2.addColorStop(0, 'rgba(0,0,0,.9)'); g2.addColorStop(1, 'rgba(60,62,70,.55)');
    c.save(); c.beginPath(); c.ellipse(fx, hy + 10, fw, 45, 0, 0, 7); c.clip(); c.fillStyle = g2; c.fillRect(fx - 50, hy - 40, 100, 110); c.restore();
    for (const side of [-1, 1]) {
      const ex = fx + side * 15 * fz;
      c.save(); if (glow) { c.shadowColor = 'rgba(255,250,225,.95)'; c.shadowBlur = 26 * glow * fz; }
      ell(c, ex, hy + 2, 9.5 * fz + 1, 6, '#F4F1EA'); c.restore();
      circ(c, ex + hs * 2, hy + 2, 3.6 * Math.max(.4, fz), '#111');
    }
    c.globalAlpha = 1;
  }
  c.restore(); c.restore();
}
window.PROMO = {
  async ready() { await document.fonts.load('800 40px Inter'); await document.fonts.load('900 40px Inter'); },
  char(kind, o) {
    const c = document.createElement('canvas'); c.width = 700; c.height = 1000; const x = c.getContext('2d');
    person(x, kind, 350, 960, 3.0, Object.assign({ t: 1.3 }, o));
    return c.toDataURL('image/png').split(',')[1];
  },
  wall(kind) {
    const c = document.createElement('canvas'); c.width = 1080; c.height = 1920; const x = c.getContext('2d');
    if (kind === 1) { blockBg(x, 2, { night: true }); person(x, 'kaptur', 760, 1760, 2.4, { t: 1, back: true }); snow(x, 3, 120, .6); }
    if (kind === 2) { peepPOV(x, 1, (cc, cx, cy, r) => { cc.fillStyle = '#A9A595'; cc.fillRect(cx - r, cy - r, 2 * r, 2 * r); cc.save(); cc.translate(cx, cy + 1080); person(cc, 'kaptur', 0, 0, 4.6, { t: 1, glow: 1 }); cc.restore(); }); }
    if (kind === 3) { quilted(x, 0, 0, 1080, 1920, '#5E4029', '#4D3420', '#B8914E', 110); circ(x, 540, 900, 120, '#2A2420'); circ(x, 540, 900, 96, '#9C7B3E'); circ(x, 540, 900, 70, '#000'); fillRR(x, 440, 640, 200, 80, 40, '#C9A15A'); txt(x, '94', 540, 680, 52, '#3A2A1A', 900);
      x.save(); x.translate(540, 1380); x.rotate(-.02); fillRR(x, -440, -120, 880, 240, 24, '#D7263D'); txt(x, 'NIE PYTAJ', 0, -44, 96, '#FFFFFF', 900); txt(x, '„KTO TAM?”', 0, 54, 96, '#FFFFFF', 900); x.restore(); }
    const g = x.createRadialGradient(540, 960, 500, 540, 960, 1250); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.55)'); x.fillStyle = g; x.fillRect(0, 0, 1080, 1920);
    return c.toDataURL('image/jpeg', .9).split(',')[1];
  },
  heroBg() {
    const c = document.createElement('canvas'); c.width = 1080; c.height = 1350; const x = c.getContext('2d');
    x.translate(0, -420); blockBg(x, 2, { night: true });
    const wx = 110 + 5 * 107.5 + 53.75, wy = 400 + 40 + 89 + 27;
    x.fillStyle = 'rgba(120,160,230,.35)'; x.beginPath(); x.arc(wx, wy, 40, 0, 7); x.fill();
    snow(x, 3, 90, .6);
    x.setTransform(1, 0, 0, 1, 0, 0);
    const g = x.createLinearGradient(0, 900, 0, 1350); g.addColorStop(0, 'rgba(7,9,16,0)'); g.addColorStop(1, 'rgba(7,9,16,1)'); x.fillStyle = g; x.fillRect(0, 0, 1080, 1350);
    return c.toDataURL('image/jpeg', .9).split(',')[1];
  },
  // klatki Kaptura do animacji na stronie: 0 tyłem, 1 przodem (świecące oczy), 2..9 chód tyłem
  kapturSheet() {
    const FW = 480, FH = 780, c = document.createElement('canvas'); c.width = FW * 10; c.height = FH; const x = c.getContext('2d');
    const fr = [{ t: 1, back: true }, { t: 1, glow: 1 }];
    for (let k = 0; k < 8; k++) fr.push({ t: 1, back: true, walk: k * Math.PI / 4 });
    fr.forEach((o, i) => { x.save(); x.beginPath(); x.rect(i * FW, 0, FW, FH); x.clip(); person(x, 'kaptur', i * FW + FW / 2, 760, 2.4, o); x.restore(); });
    return c.toDataURL('image/png').split(',')[1];
  },
  // obrót Kaptura: wiersz 0 = z tyłu na przód, wiersz 1 = z przodu na tył; 24 klatki, głowa wyprzedza ciało
  kapturTurn() {
    const FW = 480, FH = 780, N = 24, c = document.createElement('canvas'); c.width = FW * N; c.height = FH * 2; const x = c.getContext('2d');
    for (let r = 0; r < 2; r++) for (let i = 0; i < N; i++) {
      const q = i / (N - 1), th = r === 0 ? q * Math.PI : (1 - q) * Math.PI;
      const hth = Math.max(0, Math.min(Math.PI, th + (r === 0 ? 1 : -1) * 0.5 * Math.sin(q * Math.PI)));
      x.save(); x.beginPath(); x.rect(i * FW, r * FH, FW, FH); x.clip(); kap3d(x, i * FW + FW / 2, r * FH + 760, 2.4, th, hth, 1); x.restore();
    }
    return c.toDataURL('image/png').split(',')[1];
  },
  // animowana postać do strony: N klatek ruchu w spoczynku (pętla tam i z powrotem)
  // animowana postać do strony: 24 klatki, pełna pętla (wszystkie ruchy okresowe), bez ruchu w spoczynku silnika
  charSheet(kind, o) {
    const FW = 420, FH = 500, N = 24, c = document.createElement('canvas'); c.width = FW * N; c.height = FH; const x = c.getContext('2d');
    for (let i = 0; i < N; i++) {
      const f = i / N * Math.PI * 2, oo = Object.assign({ t: 1.3, still: true, blink: false }, o);
      let bob = Math.abs(Math.sin(f)) * -6, rot = 0;
      if (kind === 'ola') { oo.aR = 2.5 + .45 * Math.sin(f * 2); oo.aL = .2; oo.mouth = 'smile'; oo.look = .5 * Math.sin(f); oo.blink = i === 17 || i === 18; rot = .03 * Math.sin(f); }
      if (kind === 'kuba') { oo.keys = true; oo.aR = 2.2 + .5 * Math.sin(f * 2); oo.mouth = 'smile'; oo.blink = i === 5; rot = .025 * Math.sin(f * 2); bob = -Math.abs(Math.sin(f * 2)) * 8; }
      if (kind === 'zdzisiek') { oo.net = true; oo.look = Math.sin(f); oo.squint = Math.sin(f) > .7 || Math.sin(f) < -.7; rot = .02 * Math.sin(f); }
      if (kind === 'kaptur') { oo.glow = .35 + .65 * (.5 + .5 * Math.sin(f)); oo.look = .6 * Math.sin(f); rot = .035 * Math.sin(f); bob = -2 * Math.sin(f); }
      oo.rot = rot;
      x.save(); x.beginPath(); x.rect(i * FW, 0, FW, FH); x.clip(); person(x, kind, i * FW + FW / 2 - 20, 482 + bob, 1.38, oo); x.restore();
    }
    return c.toDataURL('image/png').split(',')[1];
  },
  hero() {
    const c = document.createElement('canvas'); c.width = 1080; c.height = 1350; const x = c.getContext('2d');
    x.translate(0, -420); blockBg(x, 2, { night: true });
    const wx = 110 + 5 * 107.5 + 53.75, wy = 400 + 40 + 89 + 27;
    x.fillStyle = 'rgba(120,160,230,.35)'; x.beginPath(); x.arc(wx, wy, 40, 0, 7); x.fill();
    person(x, 'kaptur', 760, 1760, 2.4, { t: 1, back: true });
    snow(x, 3, 90, .6);
    x.setTransform(1, 0, 0, 1, 0, 0);
    const g = x.createLinearGradient(0, 900, 0, 1350); g.addColorStop(0, 'rgba(7,9,16,0)'); g.addColorStop(1, 'rgba(7,9,16,1)'); x.fillStyle = g; x.fillRect(0, 0, 1080, 1350);
    return c.toDataURL('image/jpeg', .9).split(',')[1];
  },
};
</script></body></html>
