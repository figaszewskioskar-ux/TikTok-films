<style>
/* Gra BLOK 94: drzwi mieszkania 94 jako plansza; dwa tryby. Jeden, nocny wygląd. */
#b94g{--night:#0a0c14;--stair:#131726;--wall:#1b2034;--ink:#f3efe6;--muted:#aeb0c2;--sign:#d7263d;--hat:#f39c12;--ok:#30a46c;--door:#5e4029;--door2:#4d3420;--gold:#c9a15a;--led:#ff3b30;
 --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;--body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"JetBrains Mono",ui-monospace,"Courier New",monospace;
 background:var(--night);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;padding-block:28px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));scroll-margin-top:110px}

#b94g h2{font-size:clamp(38px,9vw,56px)}
#b94g .eyebrow{display:inline-block;font:800 12px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:#14161b;background:var(--hat);padding:7px 12px;border-radius:999px}
#b94g .sign{display:inline-block;background:var(--sign);color:#fff;padding:.02em .25em .08em;border-radius:.16em;transform:rotate(-1.5deg)}
#b94g button{font:inherit;cursor:pointer;border:0}

#b94g .btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;padding:14px 18px;border-radius:14px;font-weight:800;font-size:16px;text-decoration:none}
#b94g .btn.red{background:var(--sign);color:#fff;box-shadow:0 10px 24px rgba(215,38,61,.35)}
#b94g .btn.line{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px rgba(243,239,230,.3)}
/* menu */
#b94g .modes{display:grid;gap:14px;margin-top:22px}
#b94g .mode{all:unset;cursor:pointer;display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:center;background:var(--wall);border-radius:20px;padding:14px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.06)}
#b94g .mode:focus-visible{outline:3px solid var(--hat);outline-offset:3px}
#b94g .mode:hover{box-shadow:inset 0 0 0 2px var(--hat)}
#b94g .mode .pic{width:96px;height:96px;border-radius:50%;background:#000;box-shadow:0 0 0 6px var(--gold);display:grid;place-items:center;overflow:hidden}
#b94g .mode .pic img{width:120%;max-width:none;transform:translateY(22%)}
#b94g .mode h3{font-size:28px}
#b94g .mode p{margin:4px 0 6px;color:var(--muted);font-size:14.5px}
#b94g .mode small{font-weight:800;color:var(--hat);font-size:13px}
/* wspólne */
#b94g .bar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
#b94g .back{background:transparent;color:var(--muted);font-weight:700;font-size:14px;padding:8px 0}
#b94g .lives{display:flex;gap:4px;font-size:18px}
#b94g .lives span{width:22px;height:22px;border-radius:50%;background:var(--gold);box-shadow:inset 0 0 0 6px #6b5226}
#b94g .lives span.off{background:#2a2d38;box-shadow:inset 0 0 0 6px #1b1d25}
#b94g .led{font-family:var(--mono);font-weight:700;color:var(--led);background:#0d0f13;border-radius:10px;padding:6px 12px;text-shadow:0 0 12px rgba(255,59,48,.6);font-variant-numeric:tabular-nums}
/* drzwi */
#b94g .door{position:relative;border-radius:22px;padding:22px 18px 18px;overflow:hidden;
 background:radial-gradient(circle,var(--gold) 2.2px,transparent 2.6px) 0 0/44px 44px,repeating-linear-gradient(45deg,transparent 0 30px,var(--door2) 30px 32px),repeating-linear-gradient(-45deg,transparent 0 30px,var(--door2) 30px 32px),var(--door);
 box-shadow:inset 0 0 0 10px #3c2a1c,0 24px 50px rgba(0,0,0,.5)}
#b94g .plate{position:absolute;top:16px;left:50%;transform:translateX(-50%);background:var(--gold);color:#3a2a1a;font:900 18px/1 var(--body);padding:8px 16px;border-radius:999px}

#b94g .fb p{margin:6px 0 12px;color:var(--muted)}
#b94g .fb .rule{color:var(--ink);font-weight:700;background:rgba(243,156,18,.12);padding:8px 10px;border-radius:8px;margin-bottom:12px}
/* noc */
#b94g .room{position:relative;height:300px;border-radius:22px;overflow:hidden;background:#1a1d2b;box-shadow:inset 0 0 0 2px rgba(255,255,255,.05)}
#b94g .room .rdoor{position:absolute;left:24px;bottom:38px;width:120px;height:210px;border-radius:4px;background:radial-gradient(circle,var(--gold) 1.6px,transparent 2px) 0 0/22px 22px,var(--door);box-shadow:inset 0 0 0 6px #3c2a1c}
#b94g .room .handle{position:absolute;left:118px;bottom:140px;width:26px;height:8px;border-radius:4px;background:#c9cdd2;transform-origin:2px 4px;transition:transform .6s}
#b94g .room .strip{position:absolute;left:30px;bottom:38px;width:108px;height:5px;background:#ffe7a8;box-shadow:0 0 18px 4px rgba(255,225,160,.45)}
#b94g .room .shadow{position:absolute;bottom:38px;height:5px;width:26px;background:#000;opacity:0;transition:opacity .4s}
#b94g .room .floor{position:absolute;left:0;right:0;bottom:0;height:40px;background:#241b14}
#b94g .room .ola{position:absolute;right:16px;bottom:18px;height:220px;width:auto}
#b94g .room .dark{position:absolute;inset:0;background:radial-gradient(circle at 78% 55%,rgba(0,0,0,0) 0 90px,rgba(3,5,14,.85) 200px);transition:background .3s}
#b94g .room.off .dark{background:rgba(3,5,14,.93)}
#b94g .room.off .strip{opacity:1}
#b94g .room .phone{position:absolute;right:110px;top:26px;width:150px;background:#111317;border-radius:16px;padding:10px;font-size:12px;opacity:0;transform:translateY(-10px);transition:all .3s}
#b94g .room .phone.on{opacity:1;transform:none}
#b94g .room .phone b{display:block;color:#aeb0c2;font-size:11px}
#b94g .fear{height:14px;border-radius:999px;background:#22263a;overflow:hidden;flex:1}
#b94g .fear i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--hat),var(--sign));transition:width .4s}
#b94g .ev{margin-top:14px;background:var(--stair);border-radius:18px;padding:16px;min-height:220px}
#b94g .ev h3{font-size:26px}
#b94g .ev p{margin:6px 0 12px;color:var(--muted)}
#b94g .timer{height:6px;border-radius:999px;background:#22263a;overflow:hidden;margin-bottom:12px}
#b94g .timer i{display:block;height:100%;background:var(--hat);width:100%}
#b94g .pulse{animation:b94beat 1s infinite}
@keyframes b94beat{0%,100%{transform:scale(1)}15%{transform:scale(1.04)}30%{transform:scale(1)}45%{transform:scale(1.03)}}
/* wynik */
#b94g .end{text-align:center}
#b94g .end .big{font-family:var(--display);font-weight:800;font-size:72px;line-height:1;color:var(--hat)}
#b94g .end ul{text-align:left;color:var(--muted);padding-left:20px}
#b94g .end .acts{display:grid;gap:10px;margin-top:16px}
@media (prefers-reduced-motion:reduce){#b94g .pulse{animation:none}#b94g *{transition:none!important}}
</style>

      var c = list[i];
      h('<div class="bar"><button class="back" id="g-back">← Menu</button><div class="lives" aria-label="Zamki: ' + lives + ' z 3">' + [0, 1, 2].map(function (k) { return '<span class="' + (k < lives ? '' : 'off') + '"></span>'; }).join('') + '</div><span class="led">' + (i + 1) + '/10</span></div>' +
        '<div class="door"><span class="led time">' + c.t + '</span><span class="plate">94</span><span class="sfx">' + esc(c.sfx) + '</span>' +
        '<div class="peep">' + viewHTML(c.view) + '</div><div class="say">' + esc(c.say) + '</div><span class="note">' + esc(c.note) + '</span></div>' +
        '<div class="opts">' + shuffle(c.o.map(function (o, k) { return k; })).map(function (k) { return '<button class="opt" data-k="' + k + '">' + esc(c.o[k][0]) + '</button>'; }).join('') + '</div><div id="g-fb"></div>');
      document.getElementById('g-back').onclick = menu;
      if (/PUK|BUM/.test(c.sfx)) knock(); else beep(660, .25, 'sine', .05);
      [].forEach.call(box.querySelectorAll('.opt'), function (b) {
        b.onclick = function () {
          var k = +b.getAttribute('data-k'), good = c.o[k][1] === 1;
          [].forEach.call(box.querySelectorAll('.opt'), function (x) { x.disabled = true; if (c.o[+x.getAttribute('data-k')][1]) x.classList.add('ok'); });
          if (!good) { b.classList.add('bad'); lives--; beep(110, .5, 'sawtooth', .07); } else { score++; beep(880, .15); setTimeout(function () { beep(1320, .15); }, 120); }
          learned.push(c.rule);
          var last = i === list.length - 1 || lives <= 0;
          document.getElementById('g-fb').innerHTML = '<div class="fb ' + (good ? '' : 'bad') + '"><b>' + (good ? 'Dobrze!' : 'Błąd') + '</b><p>' + esc(c.o[k][2]) + '</p><div class="rule">Zasada: ' + esc(c.rule) + '</div><button class="btn red" id="g-next">' + (last ? 'Zobacz wynik' : 'Następna osoba') + '</button></div>';
          document.getElementById('g-next').onclick = function () { i++; if (last) end1(); else { round(); top(); } };
          document.getElementById('g-fb').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        };
      });
    }
    function end1() {
      var best = Math.max(store('best1'), score); store('best1', best);
      var title = lives <= 0 ? 'Kaptur wszedł do środka.' : score >= 9 ? 'Pan Zdzisiek byłby dumny.' : score >= 7 ? 'Prawie bez błędów.' : 'Kaptur jeszcze wróci.';
      h('<div class="end"><span class="eyebrow">Koniec nocy</span><div class="big" style="margin-top:14px">' + score + '/10</div><h2 style="font-size:34px;margin-top:6px">' + title + '</h2><p style="color:var(--muted)">Rekord: ' + best + '/10</p>' +
        '<ul>' + learned.filter(function (r, k, a) { return a.indexOf(r) === k; }).slice(0, 6).map(function (r) { return '<li>' + esc(r) + '</li>'; }).join('') + '</ul>' +
        '<div class="acts"><button class="btn red" id="g-again">Zagraj jeszcze raz</button><button class="btn line" id="g-other">Spróbuj „Noc w bloku 94”</button><a class="btn line" href="' + TT + '" target="_blank" rel="noopener">Oglądaj serię na TikToku</a></div></div>');
      document.getElementById('g-again').onclick = function () { game1(); top(); };
      document.getElementById('g-other').onclick = function () { game2(); top(); };
      top();
    }
    round();
  }

  /* ---------- TRYB 2: NOC W BLOKU 94 ---------- */
  function fmtClock(min) { var hh = Math.floor(min / 60), mm = Math.floor(min % 60); return String(hh).padStart(2, '0') + ':' + String(mm).padStart(2, '0'); }
  var E = [
    { h: 'Prąd gaśnie', p: 'Tylko u ciebie. Na klatce jest jasno.', fx: 'off', o: [['Zostaję w środku', 1], ['Idę do licznika', 0], ['Otwieram drzwi, żeby sprawdzić klatkę', 0]] },
    { h: 'Klamka idzie w dół', p: 'Ktoś sprawdza, czy drzwi są zamknięte.', fx: 'handle', o: [['Dzwonię na 112', 1], ['Pytam: kto tam?', 0], ['Otwieram gwałtownie, żeby go wystraszyć', 0]] },
    { h: 'Wiadomość od k4ptur_94', p: '„ładny widok z dziewiątego.”', fx: 'phone', o: [['Zrzut ekranu, blokuję, zgłaszam', 1], ['Odpisuję: kim jesteś?', 0], ['Wysyłam mu zdjęcie, że mam psa', 0]] },
    { h: 'Dwa cienie pod drzwiami', p: 'Ktoś stoi tuż za drzwiami. Cisza.', fx: 'shadow', o: [['Nie odzywam się, dzwonię na 112', 1], ['Krzyczę, żeby sobie poszedł', 0], ['Zaglądam przez szparę pod drzwiami', 0]] },
    { h: 'Puk. Puk. Puk.', p: 'Nikt nie dzwonił domofonem.', fx: 'knock', o: [['Nie odzywam się', 1], ['Pytam: kto tam?', 0], ['Otwieram na łańcuch', 0]] },
    { h: '„Policja! Otwierać!”', p: 'Wizjer jest zaklejony.', fx: 'knock', o: [['Pytam 112 o patrol pod moim adresem', 1], ['Otwieram', 0], ['Proszę o legitymację przez szparę', 0]] },
    { h: 'Kartka pod drzwiami', p: '„WIEMY, ŻE JESTEŚ SAMA.”', fx: 'shadow', o: [['Robię zdjęcie kartki i dzwonię na 112', 1], ['Wyrzucam kartkę', 0], ['Odpisuję na kartce i wsuwam ją z powrotem', 0]] },
    { h: 'Kuba chce wyjść', p: '„Zgaszę światło na klatce i zobaczę, kto tam jest.”', fx: 'knock', o: [['Zatrzymuję go w domu', 1], ['Idę z nim', 0], ['Daję mu latarkę', 0]] },
    { h: 'Metal w zamku', p: 'Ktoś przekręca klucz w twoich drzwiach.', fx: 'handle', o: [['Dociskam drzwi i dzwonię na 112', 1], ['Pytam, kto ma mój klucz', 0], ['Chowam się w szafie', 0]] },
    { h: 'Nieznany numer dzwoni', p: 'O 3:00. Trzeci raz z rzędu.', fx: 'phone', from: 'Nieznany numer', o: [['Nie odbieram i blokuję numer', 1], ['Odbieram i krzyczę', 0], ['Oddzwaniam', 0]] },
    { h: 'Płacz na klatce', p: '„Pomocy… otwórz…”', fx: 'knock', o: [['Dzwonię na 112 i mówię przez drzwi', 1], ['Otwieram', 0], ['Otwieram na łańcuch', 0]] },
    { h: 'Kusi cię relacja', p: 'Chcesz wrzucić: „sama na chacie do rana”.', fx: 'phone', from: 'Twoja relacja', o: [['Nie wrzucam', 1], ['Wrzucam z lokalizacją', 0], ['Wrzucam tylko dla znajomych znajomych', 0]] }
  ];
  function game2() {
    var fear = 0, clock = 0, alive = true, good = 0, ev = null, tmr = null, tick = null, evTimeout = null, bag = shuffle(E), bi = 0;
    var NIGHT = 360, SPEED = 4; // 360 min nocy, 4 min na sekundę ≈ 90 s gry
    h('<div class="bar"><button class="back" id="g-back">← Menu</button><span class="led" id="n-clock">00:00</span></div>' +
      '<div class="bar"><span style="font-weight:800;font-size:13px">STRACH</span><div class="fear"><i id="n-fear"></i></div></div>' +
      '<div class="room" id="n-room"><div class="rdoor"></div><div class="handle" id="n-handle"></div><div class="strip"></div><div class="shadow" id="n-s1" style="left:56px"></div><div class="shadow" id="n-s2" style="left:94px"></div><div class="floor"></div><img class="ola" src="' + IMG('ola') + '" alt="Ola"><div class="dark"></div><div class="phone" id="n-phone"><b>k4ptur_94</b><span id="n-ptxt">…</span></div></div>' +
      '<div class="ev" id="n-ev"><h3>Północ.</h3><p>Ola jest sama. Przetrwaj do szóstej rano. Na każdą decyzję masz kilka sekund.</p><button class="btn red" id="n-start">Zaczynam noc</button></div>');
    var room = document.getElementById('n-room'), fearEl = document.getElementById('n-fear'), clk = document.getElementById('n-clock'), evBox = document.getElementById('n-ev');
    function stop() { alive = false; clearInterval(tick); clearInterval(tmr); clearTimeout(evTimeout); }
    document.getElementById('g-back').onclick = function () { stop(); menu(); };
    function setFear(v) { fear = Math.max(0, Math.min(100, v)); fearEl.style.width = fear + '%'; room.classList.toggle('pulse', fear >= 60); if (fear >= 100) lose(); }
    function fx(kind, on) {
      if (!document.getElementById('n-room')) return;
      if (kind === 'off') room.classList.toggle('off', on);
      if (kind === 'handle') document.getElementById('n-handle').style.transform = on ? 'rotate(35deg)' : 'rotate(0)';
      if (kind === 'shadow') { document.getElementById('n-s1').style.opacity = on ? 1 : 0; document.getElementById('n-s2').style.opacity = on ? 1 : 0; }
      if (kind === 'phone') { document.getElementById('n-phone').classList.toggle('on', on); document.getElementById('n-ptxt').textContent = ev ? ev.p : ''; document.querySelector('#n-phone b').textContent = (ev && ev.from) || 'k4ptur_94'; }
      if (kind === 'knock' && on) knock();
    }
    function next() {
      if (!alive) return;
      ev = bag[bi++ % bag.length]; if (bi % bag.length === 0) bag = shuffle(E);
      fx(ev.fx, true); beep(220, .3, 'triangle', .06);
      var limit = Math.max(3.6, 6.5 - clock / 120); // im później, tym mniej czasu
      evBox.innerHTML = '<div class="timer"><i id="n-t"></i></div><h3>' + esc(ev.h) + '</h3><p>' + esc(ev.p) + '</p><div class="opts">' +
        shuffle([0, 1, 2]).map(function (k) { return '<button class="opt" data-k="' + k + '">' + esc(ev.o[k][0]) + '</button>'; }).join('') + '</div>';
      var t0 = Date.now(), bar = document.getElementById('n-t');
      clearInterval(tmr); tmr = setInterval(function () { var l = 1 - (Date.now() - t0) / (limit * 1000); bar.style.width = Math.max(0, l * 100) + '%'; }, 50);
      clearTimeout(evTimeout); evTimeout = setTimeout(function () { answer(-1); }, limit * 1000);
      [].forEach.call(evBox.querySelectorAll('.opt'), function (b) { b.onclick = function () { answer(+b.getAttribute('data-k'), b); }; });
    }
    function answer(k, btn) {
      if (!alive) return; clearInterval(tmr); clearTimeout(evTimeout);
      var ok = k >= 0 && ev.o[k][1] === 1;
      [].forEach.call(evBox.querySelectorAll('.opt'), function (x) { x.disabled = true; if (ev.o[+x.getAttribute('data-k')][1]) x.classList.add('ok'); });
      if (btn && !ok) btn.classList.add('bad');
      if (ok) { good++; setFear(fear - 10); beep(880, .12); } else { setFear(fear + (k < 0 ? 22 : 30)); beep(110, .45, 'sawtooth', .07); }
      if (k < 0) evBox.insertAdjacentHTML('beforeend', '<p style="color:var(--sign);font-weight:800;margin-top:10px">Za późno. Strach rośnie.</p>');
      var f = ev.fx; setTimeout(function () { if (!alive) return; fx(f, false); setTimeout(next, 900); }, 900);
    }
    function lose() { var at = clock; stop(); end2(false, at); }
    function win() { stop(); end2(true, NIGHT); }
    document.getElementById('n-start').onclick = function () {
      beep(440, .1);
      tick = setInterval(function () { clock += SPEED / 4; clk.textContent = fmtClock(clock); if (clock >= NIGHT) win(); }, 250);
      setTimeout(next, 600);
    };
    function end2(won, at) {
      var best = Math.max(store('best2'), at); store('best2', best);
      h('<div class="end"><span class="eyebrow">' + (won ? 'Świt' : 'Strach wygrał') + '</span><div class="big" style="margin-top:14px">' + fmtClock(at) + '</div>' +
        '<h2 style="font-size:34px;margin-top:6px">' + (won ? 'Ola przetrwała noc.' : 'Ola nie wytrzymała do rana.') + '</h2>' +
        '<p style="color:var(--muted)">Dobre decyzje: ' + good + ' · Rekord: ' + fmtClock(best) + '</p>' +
        '<div class="acts"><button class="btn red" id="g-again">Jeszcze jedna noc</button><button class="btn line" id="g-other">Zagraj w „Kto tam?”</button><a class="btn line" href="' + TT + '" target="_blank" rel="noopener">Oglądaj serię na TikToku</a></div></div>');
      document.getElementById('g-again').onclick = function () { game2(); top(); };
      document.getElementById('g-other').onclick = function () { game1(); top(); };
      top();
    }
  }

  menu();
})();
</script>
