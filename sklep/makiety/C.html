<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600;800&display=swap" rel=stylesheet>
<style>
*{box-sizing:border-box}body{margin:0;background:#000;color:#F2EEE6;font-family:Inter,sans-serif}
.hero{position:relative;height:760px;overflow:hidden}

.next{text-align:center;padding:10px 0 30px;font:600 12px Inter;letter-spacing:.3em;color:#8F8A80}.next b{display:block;font:400 64px Anton;color:#F2EEE6;letter-spacing:.04em;margin-top:8px}

</style></head><body>
