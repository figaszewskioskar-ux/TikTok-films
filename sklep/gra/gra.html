    { h: 'Bateria: 5%', p: 'Telefon zaraz się wyłączy.', fx: 'phone', from: 'Telefon', o: [['Podłączam ładowarkę i trzymam telefon przy sobie', 1], ['Gram dalej, jakoś to będzie', 0], ['Wyłączam telefon, żeby oszczędzać', 0]] },
    { h: 'Winda staje na 9. piętrze', p: 'Drzwi windy się otwierają. Nikt nie wysiada.', fx: 'shadow', o: [['Nie wychodzę sprawdzać', 1], ['Wychodzę zobaczyć, kto przyjechał', 0], ['Wołam przez drzwi: kto tam?', 0]] },
    { h: 'Domofon o 2:00', p: '„Kurier, otwórz, pilna paczka.”', fx: 'knock', o: [['Nie otwieram. Żaden kurier nie przychodzi o 2:00', 1], ['Otwieram domofon', 0], ['Schodzę na dół odebrać', 0]] }
  ];
  var SE = { 'Prąd gaśnie': 3, 'Kuba chce wyjść': 3, 'Metal w zamku': 4, 'Klamka idzie w dół': 2, 'Wiadomość od k4ptur_94': 2, '„Policja! Otwierać!”': 2, 'Kusi cię relacja': 2 };
  E = E.filter(function (e) { return (SE[e.h] || 0) <= PARTS; });
  var NIGHTS = { 1: { start: 6.5, min: 4.2, pen: 26, dark: .78, name: 'Noc 1' }, 2: { start: 5.5, min: 3.6, pen: 30, dark: .84, name: 'Noc 2' }, 3: { start: 4.6, min: 3.0, pen: 34, dark: .9, name: 'Noc 3' } };
  function game2(nn) {
    var N = NIGHTS[nn] || NIGHTS[1];
    var fear = 0, clock = 0, alive = true, goodN = 0, combo = 0, ev = null, tmr = null, tick = null, evTimeout = null, bag = shuffle(E), bi = 0;
    var NIGHT = 360, SPEED = 4;
    h('<div class="bar"><button class="back" id="g-back">← Menu</button><span class="eyebrow" style="background:var(--sign);color:#fff">' + N.name + '</span><span class="led" id="n-clock">00:00</span></div>' +
      '<div class="bar"><span style="font-weight:800;font-size:13px">STRACH</span><div class="fear"><i id="n-fear"></i></div></div>' +
      '<div class="room" id="n-room" style="--d:' + N.dark + '"><div class="win"></div><div class="rdoor" id="n-door"></div><div class="handle" id="n-handle"></div><div class="strip"></div><div class="shadow" id="n-s1" style="left:56px"></div><div class="shadow" id="n-s2" style="left:94px"></div><img class="ola" src="' + IMG('ola') + '" alt="Ola"><div class="dark"></div><div class="phone" id="n-phone"><b>k4ptur_94</b><span id="n-ptxt">…</span></div><span class="icon" id="n-icon"></span></div>' +
      '<div class="ev" id="n-ev"><h3>Północ.</h3><p>Ola jest sama. Przetrwaj do szóstej rano. Na każdą decyzję masz kilka sekund. Dobre decyzje z rzędu zmniejszają strach.</p><button class="btn red" id="n-start">Zaczynam noc</button></div>');
    var room = $('n-room'), fearEl = $('n-fear'), clk = $('n-clock'), evBox = $('n-ev');
    function stop() { alive = false; clearInterval(tick); clearInterval(tmr); clearTimeout(evTimeout); }
    $('g-back').onclick = function () { stop(); menu(); };
    function setFear(v) { fear = Math.max(0, Math.min(100, v)); fearEl.style.width = fear + '%'; room.classList.toggle('pulse', fear >= 60); room.classList.toggle('scared', fear >= 80); if (fear >= 100) lose(); }
    function fx(kind, on) {
      if (!$('n-room')) return;
      if (kind === 'off') room.classList.toggle('off', on);
      if (kind === 'handle') $('n-handle').style.transform = on ? 'rotate(35deg)' : 'rotate(0)';
      if (kind === 'shadow') { $('n-s1').style.opacity = on ? 1 : 0; $('n-s2').style.opacity = on ? 1 : 0; }
      if (kind === 'phone') { $('n-phone').classList.toggle('on', on); $('n-ptxt').textContent = ev ? ev.p : ''; document.querySelector('#n-phone b').textContent = (ev && ev.from) || 'k4ptur_94'; }
      if (kind === 'knock' && on) { var d = $('n-door'); d.classList.remove('knock'); void d.offsetWidth; d.classList.add('knock'); knock(); }
    }
    function icon(t, col) { var i = $('n-icon'); if (!i) return; i.textContent = t; i.style.background = col; i.classList.add('on'); setTimeout(function () { if ($('n-icon')) i.classList.remove('on'); }, 700); }
    function next() {
      if (!alive) return;
      ev = bag[bi++ % bag.length]; if (bi % bag.length === 0) bag = shuffle(E);
      fx(ev.fx, true); beep(220, .3, 'triangle', .06);
      var limit = Math.max(N.min, N.start - clock / 120);
      evBox.innerHTML = '<div class="timer"><i id="n-t"></i></div><h3>' + esc(ev.h) + '</h3><p>' + esc(ev.p) + '</p><div class="opts">' +
        shuffle([0, 1, 2]).map(function (k) { return '<button class="opt" data-k="' + k + '">' + esc(ev.o[k][0]) + '</button>'; }).join('') + '</div>';
      var t0 = Date.now(), bar = $('n-t');
      clearInterval(tmr); tmr = setInterval(function () { var l = 1 - (Date.now() - t0) / (limit * 1000); if (bar) bar.style.width = Math.max(0, l * 100) + '%'; }, 50);
      clearTimeout(evTimeout); evTimeout = setTimeout(function () { answer(-1); }, limit * 1000);
      [].forEach.call(evBox.querySelectorAll('.opt'), function (b) { b.onclick = function () { answer(+b.getAttribute('data-k'), b); }; });
    }
    function answer(k, btn) {
      if (!alive) return; clearInterval(tmr); clearTimeout(evTimeout);
      var ok = k >= 0 && ev.o[k][1] === 1;
      [].forEach.call(evBox.querySelectorAll('.opt'), function (x) { x.disabled = true; if (ev.o[+x.getAttribute('data-k')][1]) x.classList.add('ok'); });
      if (btn && !ok) btn.classList.add('bad');
      if (ok) { goodN++; combo++; setFear(fear - (8 + Math.min(combo, 4) * 2)); good(); icon(combo >= 3 ? 'SERIA ' + combo : 'DOBRZE', '#30a46c'); }
      else { combo = 0; setFear(fear + (k < 0 ? N.pen - 8 : N.pen)); bad(); icon(k < 0 ? 'ZA PÓŹNO' : 'BŁĄD', '#d7263d'); }
      var f = ev.fx; setTimeout(function () { if (!alive) return; fx(f, false); setTimeout(next, 800); }, 900);
    }
    function lose() { var at = clock; stop(); end2(false, at); }
    function win() { stop(); end2(true, NIGHT); }
    $('n-start').onclick = function () {
      beep(440, .1);
      tick = setInterval(function () { clock += SPEED / 4; clk.textContent = fmtClock(clock); if (clock >= NIGHT) win(); }, 250);
      setTimeout(next, 600);
    };
    function end2(won, at) {
      var key = 'best2n' + nn, best = Math.max(store(key), at); store(key, best);
      if (won && nn < 3 && (store('unlocked') || 1) <= nn) store('unlocked', nn + 1);
      var txt = 'Przetrwałem w grze „Noc w bloku 94” (' + N.name + ') do ' + fmtClock(at) + '. Zagraj: ' + URL_GRA;
      h('<div class="end"><span class="eyebrow">' + (won ? 'Świt' : 'Strach wygrał') + '</span><div class="big" style="margin-top:14px">' + fmtClock(at) + '</div>' +
        (won ? '<div class="medal">' + N.name.toUpperCase() + '<br>PRZETRWANA</div>' : '') +
        '<h2 style="font-size:36px;margin-top:12px">' + (won ? 'Ola przetrwała noc.' : 'Ola nie wytrzymała do rana.') + '</h2>' +
        '<p style="color:var(--muted)">Dobre decyzje: ' + goodN + ' · Rekord tej nocy: ' + fmtClock(best) + (won && nn < 3 ? ' · Odblokowano: Noc ' + (nn + 1) : '') + '</p>' +
        '<div class="acts"><button class="btn gold" id="g-share">Skopiuj wynik do komentarza</button>' + (won && nn < 3 ? '<button class="btn red" id="g-nextn">Graj: Noc ' + (nn + 1) + '</button>' : '<button class="btn red" id="g-again">Jeszcze jedna noc</button>') +
        '<button class="btn line" id="g-other">Zagraj w „Kto tam?”</button><a class="btn line" href="' + TT + '" target="_blank" rel="noopener">Oglądaj serię na TikToku</a></div></div>');
      $('g-share').onclick = function () { share(txt, this); };
      if ($('g-nextn')) $('g-nextn').onclick = function () { night = nn + 1; store('night', night); game2(night); top(); };
      if ($('g-again')) $('g-again').onclick = function () { game2(nn); top(); };
      $('g-other').onclick = function () { game1(); top(); };
      if (won) confetti();
      top();
    }
  }

  menu();
})();
</script>
